<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1on1chess.com - Tabletop Chess for Two Players</title>
    <meta name="description" content="Play chess face-to-face on tablets and iPads. Two players, one device. Features dual timers, move validation, and fullscreen mode for optimal tabletop play.">

    <!-- Google AdSense -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX"
            crossorigin="anonymous"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: #2c3e50;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2vmin;
            padding: 2vmin;
        }

        #board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            width: 60vmin;
            height: 60vmin;
            aspect-ratio: 1;
            border: 3px solid #34495e;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            transition: width 0.3s, height 0.3s;
        }
        
        .square {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 7vmin;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.2s, font-size 0.3s;
            position: relative;
            aspect-ratio: 1;
            width: 100%;
            height: 100%;
        }

        .coord-file {
            position: absolute;
            bottom: 1px;
            right: 2px;
            font-size: 2vmin;
            font-weight: bold;
            opacity: 0.6;
            pointer-events: none;
        }

        .coord-rank {
            position: absolute;
            top: 2px;
            left: 2px;
            font-size: 2vmin;
            font-weight: bold;
            opacity: 0.6;
            pointer-events: none;
        }
        
        .square.light {
            background-color: #f0d9b5;
        }
        
        .square.dark {
            background-color: #b58863;
        }
        
        .square.selected {
            background-color: #7fc97f !important;
        }
        
        .square.legal-move {
            position: relative;
        }
        
        .square.legal-move::after {
            content: '';
            position: absolute;
            width: 30%;
            height: 30%;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 50%;
        }
        
        .square.legal-move.has-piece::after {
            width: 90%;
            height: 90%;
            border-radius: 50%;
            background-color: transparent;
            border: 4px solid rgba(0, 0, 0, 0.3);
        }
        
        .piece {
            pointer-events: auto;
            cursor: grab;
        }

        .piece:active {
            cursor: grabbing;
        }

        .square.drag-over {
            background-color: rgba(127, 201, 127, 0.5) !important;
        }

        .piece.white {
            color: white;
            text-shadow: 0 0 2px black, 0 0 2px black, 0 0 2px black;
        }

        .piece.black {
            display: inline-block;
            transform: rotate(180deg);
        }

        .piece.in-check {
            animation: check-glow 1.5s ease-in-out infinite;
        }

        @keyframes check-glow {
            0%, 100% {
                filter: drop-shadow(0 0 8px rgba(255, 0, 0, 0.8))
                        drop-shadow(0 0 15px rgba(255, 0, 0, 0.6));
            }
            50% {
                filter: drop-shadow(0 0 15px rgba(255, 0, 0, 1))
                        drop-shadow(0 0 25px rgba(255, 0, 0, 0.8));
            }
        }
        
        .timers-group {
            display: flex;
            gap: 2vmin;
            align-items: center;
            justify-content: center;
        }

        #timersTop {
            position: relative;
            transform: rotate(180deg);
        }

        #timersBottom {
            position: relative;
        }

        .timer {
            font-size: 3vmin;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 2vmin 3vmin;
            border-radius: 1vmin;
            min-width: 15vmin;
            text-align: center;
            transition: all 0.3s;
        }

        .timer.active {
            background: rgba(76, 175, 80, 0.9);
            box-shadow: 0 0 2vmin rgba(76, 175, 80, 0.8);
        }
        
        #status {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            color: white;
            padding: 3vmin 6vmin;
            border-radius: 2vmin;
            font-size: 4vmin;
            display: none;
            text-align: center;
            z-index: 1000;
        }

        #sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 350px;
            background: rgba(44, 62, 80, 0.98);
            color: white;
            padding: 20px;
            box-shadow: 2px 0 10px rgba(0, 0, 0, 0.5);
            z-index: 100;
            overflow-y: auto;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #sidebar.collapsed {
            transform: translateX(-100%);
        }

        #sidebarToggle {
            position: fixed;
            left: 350px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(52, 152, 219, 0.9);
            color: white;
            border: none;
            padding: 20px 10px;
            cursor: pointer;
            z-index: 101;
            border-radius: 0 5px 5px 0;
            font-weight: bold;
            transition: left 0.3s;
        }

        #sidebarToggle.collapsed {
            left: 0;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .controls-row {
            display: flex;
            gap: 10px;
        }

        button {
            padding: 12px 20px;
            font-size: 14px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            flex: 1;
        }

        button:hover {
            background: #2980b9;
        }

        button:active {
            transform: scale(0.95);
        }

        #moveList {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 5px;
            font-family: monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            line-height: 1.8;
        }

        #moveList .move-pair {
            margin-bottom: 5px;
        }

        #moveList .move-number {
            color: #3498db;
            font-weight: bold;
        }

        h3 {
            margin: 0;
            font-size: 18px;
            color: #3498db;
        }

        .ad-container {
            margin-top: 20px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .ad-container ins {
            width: 100%;
        }

        select {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: 2px solid #3498db;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        select option {
            background: #2c3e50;
            color: white;
        }

        .radio-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .radio-option label {
            cursor: pointer;
            font-size: 14px;
        }

        .piece.rotate-for-turn {
            transform: rotate(180deg);
        }

        #fullscreenExit {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            cursor: pointer;
            font-size: 24px;
            font-weight: bold;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            transition: all 0.3s;
        }

        #fullscreenExit:hover {
            background: rgba(255, 0, 0, 0.8);
            border-color: white;
            transform: scale(1.1);
        }

        #fullscreenExit.visible {
            display: flex;
        }

        /* Fullscreen mode - expand board to use available space */
        /* Class-based approach (works everywhere, including file:// URLs) */
        #gameContainer.fullscreen-mode #board {
            width: 85vmin;
            height: 85vmin;
        }

        #gameContainer.fullscreen-mode .square {
            font-size: 10.5vmin;
        }

        #gameContainer.fullscreen-mode .coord-file,
        #gameContainer.fullscreen-mode .coord-rank {
            font-size: 2.5vmin;
        }

        /* Browser fullscreen pseudo-class (bonus enhancement when browser fullscreen works) */
        :fullscreen #board,
        :-webkit-full-screen #board,
        :-moz-full-screen #board,
        :-ms-fullscreen #board {
            width: 85vmin;
            height: 85vmin;
        }

        :fullscreen .square,
        :-webkit-full-screen .square,
        :-moz-full-screen .square,
        :-ms-fullscreen .square {
            font-size: 10.5vmin;
        }

        :fullscreen .coord-file,
        :fullscreen .coord-rank,
        :-webkit-full-screen .coord-file,
        :-webkit-full-screen .coord-rank,
        :-moz-full-screen .coord-file,
        :-moz-full-screen .coord-rank,
        :-ms-fullscreen .coord-file,
        :-ms-fullscreen .coord-rank {
            font-size: 2.5vmin;
        }
    </style>
</head>
<body>
    <button id="fullscreenExit">×</button>
    <div id="gameContainer">
        <div id="timersTop" class="timers-group">
            <div id="blackTimerTop" class="timer">⚫ 10:00</div>
            <div id="whiteTimerTop" class="timer">⚪ 10:00</div>
        </div>
        <div id="board"></div>
        <div id="timersBottom" class="timers-group">
            <div id="whiteTimerBottom" class="timer">⚪ 10:00</div>
            <div id="blackTimerBottom" class="timer">⚫ 10:00</div>
        </div>
    </div>
    <div id="status"></div>

    <button id="sidebarToggle">◄</button>

    <div id="sidebar">
        <h3>Time Control</h3>
        <select id="timeControl">
            <option value="600:0">10+0 (Rapid)</option>
            <option value="300:0">5+0 (Blitz)</option>
            <option value="300:3">5+3 (Blitz)</option>

                <input type="radio" id="rotationTurnBased" name="rotationMode" value="turn-based">

        <h3>Move History (PGN)</h3>
        <div id="moveList">No moves yet</div>

        <!-- AdSense Ad Unit -->

            <ins class="adsbygoogle"
                 style="display:block"

                 data-full-width-responsive="true"></ins>

                (adsbygoogle = window.adsbygoogle || []).push({});

        <!-- Privacy Policy Link -->
        <div style="margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); text-align: center;">

    <script>
        // Unicode chess pieces
        const PIECES = {
            'K': '♔', 'Q': '♕', 'R': '♖', 'B': '♗', 'N': '♘', 'P': '♙',
            'k': '♚', 'q': '♛', 'r': '♜', 'b': '♝', 'n': '♞', 'p': '♟'
        };

        // Storage Manager
        class StorageManager {
            static save(key, data) {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                } catch (e) {
                    console.error('Failed to save to localStorage:', e);
                }
            }

            static load(key) {
                try {
                    const data = localStorage.getItem(key);
                    return data ? JSON.parse(data) : null;
                } catch (e) {
                    console.error('Failed to load from localStorage:', e);
                    return null;
                }
            }

            static clear(key) {
                try {
                    localStorage.removeItem(key);
                } catch (e) {
                    console.error('Failed to clear localStorage:', e);
                }
            }
        }

        // Game State Manager
        class GameState {
            constructor() {
                this.chess = new Chess();
                this.parseTimeControl();
                this.lastUpdate = Date.now();
                this.gameOver = false;
                this.gameStarted = false;
                this.moveHistory = [];
                this.pgnMoves = [];
                this.currentMoveIndex = -1;
                this.loadState();
            }

            parseTimeControl() {
                const select = document.getElementById('timeControl');
                const value = select ? select.value : '600:0';
                const [time, increment] = value.split(':').map(Number);
                this.initialTime = time;
                this.increment = increment;
                this.whiteTime = time;
                this.blackTime = time;
            }

            makeMove(from, to) {
                // If viewing history, return to current position first
                if (this.currentMoveIndex < this.moveHistory.length - 1) {
                    this.goToMove(this.moveHistory.length - 1);
                }

                const move = this.chess.move({ from, to, promotion: 'q' });
                if (move) {
                    // Start clock on first move
                    if (!this.gameStarted) {
                        this.gameStarted = true;
                        this.lastUpdate = Date.now();
                    }

                    this.updateTimer();

                    // Add increment to the player who just moved
                    if (this.increment > 0) {
                        if (this.chess.turn() === 'b') {
                            // White just moved
                            this.whiteTime += this.increment;
                        } else {
                            // Black just moved
                            this.blackTime += this.increment;
                        }
                    }

                    this.moveHistory.push(this.chess.fen());
                    this.pgnMoves.push(move.san);
                    this.currentMoveIndex = this.moveHistory.length - 1;
                    this.saveState();
                    this.updateMoveList();
                    return this.checkGameStatus();
                }
                return null;
            }

            updateMoveList() {
                const moveListEl = document.getElementById('moveList');
                if (this.pgnMoves.length === 0) {
                    moveListEl.innerHTML = 'No moves yet';
                    return;
                }

                let html = '';
                for (let i = 0; i < this.pgnMoves.length; i += 2) {
                    const moveNum = Math.floor(i / 2) + 1;
                    const whiteMove = this.pgnMoves[i];
                    const blackMove = this.pgnMoves[i + 1] || '';
                    html += `<div class="move-pair"><span class="move-number">${moveNum}.</span> ${whiteMove} ${blackMove}</div>`;
                }
                moveListEl.innerHTML = html;
                moveListEl.scrollTop = moveListEl.scrollHeight;
            }

            updateTimer() {
                if (!this.gameStarted) return;

                const now = Date.now();
                const elapsed = (now - this.lastUpdate) / 1000;

                if (this.chess.turn() === 'w') {
                    this.whiteTime = Math.max(0, this.whiteTime - elapsed);
                } else {
                    this.blackTime = Math.max(0, this.blackTime - elapsed);
                }

                this.lastUpdate = now;

                if (this.whiteTime <= 0 || this.blackTime <= 0) {
                    this.gameOver = true;
                }
            }

            goToMove(index) {
                if (index < 0 || index >= this.moveHistory.length) return;
                this.currentMoveIndex = index;
                this.chess.load(this.moveHistory[index]);
            }

            goToStart() {
                this.chess.reset();
                this.currentMoveIndex = -1;
            }

            goToPrevMove() {
                if (this.currentMoveIndex > -1) {
                    this.currentMoveIndex--;
                    if (this.currentMoveIndex === -1) {
                        this.chess.reset();
                    } else {
                        this.chess.load(this.moveHistory[this.currentMoveIndex]);
                    }
                }
            }

            goToNextMove() {
                if (this.currentMoveIndex < this.moveHistory.length - 1) {
                    this.currentMoveIndex++;
                    this.chess.load(this.moveHistory[this.currentMoveIndex]);
                }
            }

            goToEnd() {
                if (this.moveHistory.length > 0) {
                    this.currentMoveIndex = this.moveHistory.length - 1;
                    this.chess.load(this.moveHistory[this.currentMoveIndex]);
                }
            }

            takeBack() {
                if (this.moveHistory.length > 0) {
                    // Remove last move from history
                    this.moveHistory.pop();
                    this.pgnMoves.pop();

                    // Go back to previous position
                    if (this.moveHistory.length > 0) {
                        this.currentMoveIndex = this.moveHistory.length - 1;
                        this.chess.load(this.moveHistory[this.currentMoveIndex]);
                    } else {
                        // No moves left, reset to start
                        this.chess.reset();
                        this.currentMoveIndex = -1;
                        this.gameStarted = false;
                    }

                    this.gameOver = false;
                    this.saveState();
                    this.updateMoveList();
                    return true;
                }
                return false;
            }

            checkGameStatus() {
                if (this.chess.in_checkmate()) {
                    this.gameOver = true;
                    return `Checkmate! ${this.chess.turn() === 'w' ? 'Black' : 'White'} wins!`;
                }
                if (this.chess.in_draw()) {
                    this.gameOver = true;
                    return "Draw!";
                }
                if (this.chess.in_stalemate()) {
                    this.gameOver = true;
                    return "Stalemate!";
                }
                if (this.chess.in_check()) {
                    return "Check!";
                }
                return null;
            }

            saveState() {
                StorageManager.save('chessGame', {
                    fen: this.chess.fen(),
                    whiteTime: this.whiteTime,
                    blackTime: this.blackTime,
                    lastUpdate: this.lastUpdate,
                    gameOver: this.gameOver,
                    gameStarted: this.gameStarted,
                    moveHistory: this.moveHistory,
                    pgnMoves: this.pgnMoves,
                    currentMoveIndex: this.currentMoveIndex,
                    initialTime: this.initialTime,
                    increment: this.increment
                });
            }

            loadState() {
                const saved = StorageManager.load('chessGame');
                if (saved) {
                    this.chess.load(saved.fen);
                    this.whiteTime = saved.whiteTime;
                    this.blackTime = saved.blackTime;
                    this.lastUpdate = Date.now();
                    this.gameOver = saved.gameOver;
                    this.gameStarted = saved.gameStarted || false;
                    this.moveHistory = saved.moveHistory || [];
                    this.pgnMoves = saved.pgnMoves || [];
                    this.currentMoveIndex = saved.currentMoveIndex ?? -1;
                    this.initialTime = saved.initialTime || 600;
                    this.increment = saved.increment || 0;
                    this.updateMoveList();
                }
            }

            reset() {
                this.chess.reset();
                this.parseTimeControl();
                this.lastUpdate = Date.now();
                this.gameOver = false;
                this.gameStarted = false;
                this.moveHistory = [];
                this.pgnMoves = [];
                this.currentMoveIndex = -1;
                this.saveState();
                this.updateMoveList();
            }

            clearSaved() {
                StorageManager.clear('chessGame');
            }
        }

        // Board Renderer
        class BoardRenderer {
            constructor(boardElement, gameState) {
                this.boardElement = boardElement;
                this.gameState = gameState;
                this.squares = [];
                this.selectedSquare = null;
                this.legalMoves = [];
                this.flipped = false;
                this.draggedFrom = null;
                this.rotationMode = this.loadRotationMode();
                this.render();
            }

            loadRotationMode() {
                const saved = localStorage.getItem('rotationMode');
                return saved || 'fixed';
            }

            setRotationMode(mode) {
                this.rotationMode = mode;
                localStorage.setItem('rotationMode', mode);
                this.render();
            }

            flipBoard() {
                this.flipped = !this.flipped;
                this.render();
            }

            render() {
                this.boardElement.innerHTML = '';
                this.squares = [];

                const board = this.gameState.chess.board();
                const inCheck = this.gameState.chess.in_check();
                const currentTurn = this.gameState.chess.turn();

                for (let row = 0; row < 8; row++) {
                    for (let col = 0; col < 8; col++) {
                        const displayRow = this.flipped ? 7 - row : row;
                        const displayCol = this.flipped ? 7 - col : col;

                        const square = document.createElement('div');
                        square.className = 'square ' + ((row + col) % 2 === 0 ? 'light' : 'dark');

                        const file = String.fromCharCode(97 + col);
                        const rank = 8 - row;
                        const position = file + rank;
                        square.dataset.position = position;

                        // Add coordinates on edges
                        const isLeftEdge = col === 0;
                        const isRightEdge = col === 7;
                        const isTopEdge = row === 0;
                        const isBottomEdge = row === 7;

                        const piece = board[displayRow][displayCol];
                        if (piece) {
                            const pieceChar = piece.color === 'w' ? piece.type.toUpperCase() : piece.type;

                            // Add check indicator to king in check
                            const checkClass = (inCheck && piece.type === 'k' && piece.color === currentTurn) ? ' in-check' : '';

                            // Determine rotation and color class based on mode
                            let colorClass = '';
                            let rotationClass = '';

                            if (this.rotationMode === 'fixed') {
                                // Fixed mode: apply color class (black pieces get rotated via .piece.black CSS)
                                colorClass = piece.color === 'b' ? ' black' : ' white';
                            } else if (this.rotationMode === 'turn-based') {
                                // Turn-based mode: only apply white class for styling, rotate all pieces on black's turn
                                colorClass = piece.color === 'w' ? ' white' : '';
                                if (currentTurn === 'b') {
                                    rotationClass = ' rotate-for-turn';
                                }
                            }

                            const pieceElement = document.createElement('span');
                            pieceElement.className = `piece${colorClass}${checkClass}${rotationClass}`;
                            pieceElement.textContent = PIECES[pieceChar];
                            pieceElement.draggable = true;
                            pieceElement.addEventListener('dragstart', (e) => this.handleDragStart(e, position));

                            square.appendChild(pieceElement);
                            square.classList.add('has-piece');
                        }

                        // Add coordinate labels
                        if (isBottomEdge) {
                            const fileLabel = document.createElement('div');
                            fileLabel.className = 'coord-file';
                            fileLabel.textContent = file;
                            square.appendChild(fileLabel);
                        }
                        if (isLeftEdge) {
                            const rankLabel = document.createElement('div');
                            rankLabel.className = 'coord-rank';
                            rankLabel.textContent = rank;
                            square.appendChild(rankLabel);
                        }

                        square.addEventListener('click', () => this.handleSquareClick(position));
                        square.addEventListener('dragover', (e) => this.handleDragOver(e, square));
                        square.addEventListener('dragleave', (e) => this.handleDragLeave(e, square));
                        square.addEventListener('drop', (e) => this.handleDrop(e, position));

                        this.boardElement.appendChild(square);
                        this.squares.push({ element: square, position });
                    }
                }
            }

            handleSquareClick(position) {
                if (this.gameState.gameOver) return;
                
                if (this.selectedSquare) {
                    if (this.legalMoves.includes(position)) {
                        const status = this.gameState.makeMove(this.selectedSquare, position);
                        this.render();
                        if (status) {
                            this.showStatus(status);
                        }
                    }
                    this.clearSelection();
                } else {
                    const piece = this.gameState.chess.get(position);
                    if (piece && piece.color === this.gameState.chess.turn()) {
                        this.selectSquare(position);
                    }
                }
            }

            selectSquare(position) {
                this.selectedSquare = position;
                this.legalMoves = this.gameState.chess.moves({ square: position, verbose: true })
                    .map(move => move.to);
                
                this.squares.forEach(({ element, position: pos }) => {
                    if (pos === position) {
                        element.classList.add('selected');
                    } else if (this.legalMoves.includes(pos)) {
                        element.classList.add('legal-move');
                    }
                });
            }

            clearSelection() {
                this.selectedSquare = null;
                this.legalMoves = [];
                this.squares.forEach(({ element }) => {
                    element.classList.remove('selected', 'legal-move');
                });
            }

            handleDragStart(e, position) {
                if (this.gameState.gameOver) {
                    e.preventDefault();
                    return;
                }

                const piece = this.gameState.chess.get(position);
                if (!piece || piece.color !== this.gameState.chess.turn()) {
                    e.preventDefault();
                    return;
                }

                this.draggedFrom = position;
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', position);

                // Create a better drag image for white pieces visibility
                const dragElement = e.target.cloneNode(true);
                dragElement.style.position = 'absolute';
                dragElement.style.top = '-1000px';
                dragElement.style.fontSize = '7vmin';
                dragElement.style.padding = '10px';
                dragElement.style.background = 'rgba(0, 0, 0, 0.1)';
                dragElement.style.borderRadius = '5px';
                document.body.appendChild(dragElement);

                e.dataTransfer.setDragImage(dragElement, 25, 25);

                setTimeout(() => document.body.removeChild(dragElement), 0);
            }

            handleDragOver(e, square) {
                if (!this.draggedFrom) return;

                e.preventDefault();
                e.dataTransfer.dropEffect = 'move';
                square.classList.add('drag-over');
            }

            handleDragLeave(e, square) {
                square.classList.remove('drag-over');
            }

            handleDrop(e, position) {
                e.preventDefault();

                this.squares.forEach(({ element }) => {
                    element.classList.remove('drag-over');
                });

                if (!this.draggedFrom || this.draggedFrom === position) {
                    this.draggedFrom = null;
                    return;
                }

                const status = this.gameState.makeMove(this.draggedFrom, position);
                this.render();
                if (status) {
                    this.showStatus(status);
                }

                this.draggedFrom = null;
            }

            showStatus(message) {
                const statusEl = document.getElementById('status');
                statusEl.textContent = message;
                statusEl.style.display = 'block';
                setTimeout(() => {
                    statusEl.style.display = 'none';
                }, 3000);
            }
        }

        // Timer Display
        class TimerDisplay {
            constructor(gameState) {
                this.gameState = gameState;
                this.elements = {
                    whiteTop: document.getElementById('whiteTimerTop'),
                    whiteBottom: document.getElementById('whiteTimerBottom'),
                    blackTop: document.getElementById('blackTimerTop'),
                    blackBottom: document.getElementById('blackTimerBottom')
                };
                this.update();
                setInterval(() => this.update(), 100);
            }

            update() {
                if (!this.gameState.gameOver) {
                    this.gameState.updateTimer();
                }

                const whiteTime = this.formatTime(this.gameState.whiteTime);
                const blackTime = this.formatTime(this.gameState.blackTime);

                this.elements.whiteTop.textContent = '⚪ ' + whiteTime;
                this.elements.whiteBottom.textContent = '⚪ ' + whiteTime;
                this.elements.blackTop.textContent = '⚫ ' + blackTime;
                this.elements.blackBottom.textContent = '⚫ ' + blackTime;

                const isWhiteTurn = this.gameState.chess.turn() === 'w';

                // Only player's own clock on their side should be green (left side from their view)
                this.elements.whiteBottom.classList.toggle('active', isWhiteTurn);
                this.elements.blackTop.classList.toggle('active', !isWhiteTurn);
                this.elements.whiteTop.classList.remove('active');
                this.elements.blackBottom.classList.remove('active');

                if (this.gameState.whiteTime <= 0 && !this.gameState.gameOver) {
                    this.gameState.gameOver = true;
                    this.gameState.saveState();
                    this.showStatus('Time up! Black wins!');
                } else if (this.gameState.blackTime <= 0 && !this.gameState.gameOver) {
                    this.gameState.gameOver = true;
                    this.gameState.saveState();
                    this.showStatus('Time up! White wins!');
                }
            }

            formatTime(seconds) {
                seconds = Math.max(0, seconds);
                const mins = Math.floor(seconds / 60);
                const secs = Math.floor(seconds % 60);
                return `${mins}:${secs.toString().padStart(2, '0')}`;
            }

            showStatus(message) {
                const statusEl = document.getElementById('status');
                statusEl.textContent = message;
                statusEl.style.display = 'block';
            }
        }

        // Main Game Controller
        class ChessGame {
            constructor() {
                this.gameState = new GameState();
                this.board = new BoardRenderer(
                    document.getElementById('board'),
                    this.gameState
                );
                this.timer = new TimerDisplay(this.gameState);
                this.lastTwoFingerTap = 0;
                this.initialPinchDistance = 0;
                this.setupControls();
                this.setupFullscreenGestures();
            }

            setupControls() {
                document.getElementById('newGame').addEventListener('click', () => {
                    this.gameState.reset();
                    this.board.render();
                    document.getElementById('status').style.display = 'none';
                });

                document.getElementById('flipBoard').addEventListener('click', () => {
                    this.board.flipBoard();
                });

                document.getElementById('takeBack').addEventListener('click', () => {
                    if (this.gameState.takeBack()) {
                        this.board.render();
                        document.getElementById('status').style.display = 'none';
                    }
                });

                document.getElementById('clearStorage').addEventListener('click', () => {
                    if (confirm('Clear saved game and start fresh?')) {
                        this.gameState.clearSaved();
                        this.gameState.reset();
                        this.board.render();
                        document.getElementById('status').style.display = 'none';
                    }
                });

                // Navigation controls
                document.getElementById('navFirst').addEventListener('click', () => {
                    this.gameState.goToStart();
                    this.board.render();
                });

                document.getElementById('navPrev').addEventListener('click', () => {
                    this.gameState.goToPrevMove();
                    this.board.render();
                });

                document.getElementById('navNext').addEventListener('click', () => {
                    this.gameState.goToNextMove();
                    this.board.render();
                });

                document.getElementById('navLast').addEventListener('click', () => {
                    this.gameState.goToEnd();
                    this.board.render();
                });

                // Time control change
                document.getElementById('timeControl').addEventListener('change', () => {
                    if (confirm('Change time control? This will start a new game.')) {
                        this.gameState.reset();
                        this.board.render();
                        document.getElementById('status').style.display = 'none';
                    }
                });

                // Rotation mode
                const rotationRadios = document.querySelectorAll('input[name="rotationMode"]');
                // Initialize radio buttons from saved state
                const savedMode = this.board.rotationMode;
                rotationRadios.forEach(radio => {
                    if (radio.value === savedMode) {
                        radio.checked = true;
                    }
                    radio.addEventListener('change', (e) => {
                        if (e.target.checked) {
                            this.board.setRotationMode(e.target.value);
                        }
                    });
                });

                // Fullscreen button
                document.getElementById('fullscreenBtn').addEventListener('click', () => {
                    this.enterFullscreen();
                });

                // Fullscreen exit button
                document.getElementById('fullscreenExit').addEventListener('click', () => {
                    this.exitFullscreen();
                });

                // Double-click to exit fullscreen
                document.addEventListener('dblclick', () => {
                    if (document.fullscreenElement) {
                        this.exitFullscreen();
                    }
                });

                // Listen for fullscreen changes (with vendor prefixes)
                document.addEventListener('fullscreenchange', () => {
                    this.updateFullscreenUI();
                });
                document.addEventListener('webkitfullscreenchange', () => {
                    this.updateFullscreenUI();
                });
                document.addEventListener('mozfullscreenchange', () => {
                    this.updateFullscreenUI();
                });
                document.addEventListener('msfullscreenchange', () => {
                    this.updateFullscreenUI();
                });

                // Sidebar toggle
                const sidebar = document.getElementById('sidebar');
                const toggleBtn = document.getElementById('sidebarToggle');
                toggleBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('collapsed');
                    toggleBtn.classList.toggle('collapsed');
                    // Arrow points in the direction the sidebar will move
                    toggleBtn.textContent = sidebar.classList.contains('collapsed') ? '►' : '◄';
                });
            }

            enterFullscreen() {
                // Collapse sidebar before entering fullscreen
                const sidebar = document.getElementById('sidebar');
                const toggleBtn = document.getElementById('sidebarToggle');
                const gameContainer = document.getElementById('gameContainer');

                if (!sidebar.classList.contains('collapsed')) {
                    sidebar.classList.add('collapsed');
                    toggleBtn.classList.add('collapsed');
                    toggleBtn.textContent = '►';
                }

                // Add fullscreen-mode class to expand board (works even if browser fullscreen fails)
                gameContainer.classList.add('fullscreen-mode');

                // Request browser fullscreen (bonus enhancement, may fail on file:// URLs)
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen().catch(() => {
                        // Fullscreen request failed (common on file:// URLs), but board still expands via CSS class
                    });
                } else if (elem.webkitRequestFullscreen) { // Safari
                    elem.webkitRequestFullscreen();
                } else if (elem.mozRequestFullScreen) { // Firefox
                    elem.mozRequestFullScreen();
                } else if (elem.msRequestFullscreen) { // IE/Edge
                    elem.msRequestFullscreen();
                }

                // Update UI immediately
                this.updateFullscreenUI();
            }

            exitFullscreen() {
                const gameContainer = document.getElementById('gameContainer');

                // Remove fullscreen-mode class to restore board size
                gameContainer.classList.remove('fullscreen-mode');

                // Exit browser fullscreen if active
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) { // Safari
                    document.webkitExitFullscreen();
                } else if (document.mozCancelFullScreen) { // Firefox
                    document.mozCancelFullScreen();
                } else if (document.msExitFullscreen) { // IE/Edge
                    document.msExitFullscreen();
                }

                // Update UI immediately
                this.updateFullscreenUI();
            }

            updateFullscreenUI() {
                const exitBtn = document.getElementById('fullscreenExit');
                const gameContainer = document.getElementById('gameContainer');

                // Show exit button when in fullscreen mode (either class-based or browser fullscreen)
                const isBrowserFullscreen = document.fullscreenElement ||
                                           document.webkitFullscreenElement ||
                                           document.mozFullScreenElement ||
                                           document.msFullscreenElement;
                const isFullscreenMode = gameContainer.classList.contains('fullscreen-mode');

                if (isBrowserFullscreen || isFullscreenMode) {
                    exitBtn.classList.add('visible');
                } else {
                    exitBtn.classList.remove('visible');
                }
            }

            setupFullscreenGestures() {
                let touchStartTime = 0;

                document.body.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 2) {
                        touchStartTime = Date.now();
                        const touch1 = e.touches[0];
                        const touch2 = e.touches[1];
                        this.initialPinchDistance = this.getTouchDistance(touch1, touch2);
                    }
                });

                document.body.addEventListener('touchend', (e) => {
                    if (e.changedTouches.length === 2) {
                        const now = Date.now();
                        const tapDuration = now - touchStartTime;

                        // Double two-finger tap detection (tap < 300ms)
                        if (tapDuration < 300) {
                            const timeSinceLastTap = now - this.lastTwoFingerTap;
                            if (timeSinceLastTap < 500) {
                                this.toggleFullscreen();
                                this.lastTwoFingerTap = 0;
                            } else {
                                this.lastTwoFingerTap = now;
                            }
                        }
                    }
                });

                document.body.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2) {
                        const touch1 = e.touches[0];
                        const touch2 = e.touches[1];
                        const currentDistance = this.getTouchDistance(touch1, touch2);

                        // Detect pinch out (spread) gesture - increase of 100px or more
                        if (this.initialPinchDistance > 0 && currentDistance - this.initialPinchDistance > 100) {
                            this.toggleFullscreen();
                            this.initialPinchDistance = 0;
                        }
                    }
                });
            }

            getTouchDistance(touch1, touch2) {
                const dx = touch2.clientX - touch1.clientX;
                const dy = touch2.clientY - touch1.clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            toggleFullscreen() {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen().catch(err => {
                        console.log('Fullscreen request failed:', err);
                    });
                } else {
                    if (document.exitFullscreen) {
                        document.exitFullscreen();
                    }
                }
            }
        }

        // Start the game
        new ChessGame();
    </script>
